  <circle cx="473" cy="446" r="68" fill="#d4571f" opacity=".18" filter="url(#soft)"/>
  <style>
    .route{animation:route 7s linear infinite}.selected{transform-origin:779px 645px;animation:select 3.8s ease-in-out infinite}
