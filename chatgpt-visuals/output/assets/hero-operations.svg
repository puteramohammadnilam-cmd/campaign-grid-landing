    <linearGradient id="zoneB" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#b3400f" stop-opacity=".68"/><stop offset="1" stop-color="#d4571f" stop-opacity=".2"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="920" height="760" rx="36" fill="#071426"/>
