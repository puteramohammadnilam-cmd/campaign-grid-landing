      <rect y="56" width="242" height="42" rx="5" fill="#173756"/><rect x="14" y="70" width="14" height="14" fill="none" stroke="#dcb63f" stroke-width="2"/><rect x="44" y="70" width="154" height="7" fill="#b8c3cf" opacity=".7"/>
      <rect y="112" width="242" height="42" rx="5" fill="#173756"/><rect x="14" y="126" width="14" height="14" fill="none" stroke="#dcb63f" stroke-width="2"/><rect x="44" y="126" width="105" height="7" fill="#b8c3cf" opacity=".7"/>
