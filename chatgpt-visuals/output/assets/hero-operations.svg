    <path d="M144 333 326 346 410 458 318 615 112 568Z" fill="#102540" stroke="#6b7f96" stroke-width="2"/>
    <path d="M369 197 522 146 573 272 476 376 326 346Z" fill="#132d49" stroke="#6b7f96" stroke-width="2"/>
    <path d="M326 346 476 376 488 536 318 615 410 458Z" fill="url(#zoneB)" stroke="#d4571f" stroke-width="2"/>
